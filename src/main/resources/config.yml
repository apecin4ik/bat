# Сколько уровней в пропуске (меняется и в меню /bp edit)
max-levels: 30

# Сколько опыта нужно на один уровень по умолчанию
# (для конкретного уровня можно задать своё значение в редакторе наград)
default-xp-per-level: 500

# Как часто сохранять прогресс игроков (минуты)
autosave-minutes: 5

# Часовой пояс для ежедневных заданий.
# "system" — как на сервере, либо название зоны: UTC, Europe/Moscow, Europe/Kyiv и т.д.
timezone: system

# Во сколько (час, 0-23, по часовому поясу выше) начинается новый день заданий.
# При 4 ежедневные задания обновятся в 04:00, а не в полночь.
daily-reset-hour: 4

# Защита от фарма «поставил — сломал»
anti-farm:
  enabled: true
  # Сколько позиций блоков помнить (старые вытесняются, при перезапуске сервера память очищается)
  memory: 50000
